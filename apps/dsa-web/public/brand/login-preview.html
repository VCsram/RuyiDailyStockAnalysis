<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录页 Logo 预览 · 如意金股</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b12;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #e2e8f0;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 48px 40px;
        border-radius: 24px;
        border: 1px solid rgba(56, 189, 248, 0.18);
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }
      .mark { width: 80px; height: 80px; }
      .logo { width: min(420px, 86vw); height: auto; }
      .meta { font-size: 12px; letter-spacing: 0.08em; color: #94a3b8; text-transform: uppercase; }
      .note { margin-top: 8px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="mark" src="/brand/icon.svg" alt="如意金股" />
      <img class="logo" src="/brand/logo-dark.svg" alt="如意金股 RuyiDailyStockAnalysis" />
      <div class="meta">Author · creeper</div>
      <div class="note">认证关闭时的登录页视觉预览（不改 .env）</div>
    </div>
  </body>
</html>
